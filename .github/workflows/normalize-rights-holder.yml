name: Normalize Copyright Holder

on:
  push:
    branches: ["agent/corpus-industry-standards-normalisation"]
    paths:
      - ".github/scripts/RIGHTS-HOLDER-NORMALIZATION.md"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize obsolete co-copyright lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("Governance/Constitution"), Path("Governance/Charters"), Path("Governance/Laws"), Path("Governance/Standards")]
          patterns = [
              re.compile(r"©\s*(20\d{2})\s+Dr\.?\s+Michelle(?:\s+Vivian)?\s+O[’']Rourke\s*&\s*CAM Initiative\.\s*All rights reserved\.", re.IGNORECASE),
              re.compile(r"©\s*(20\d{2})\s+CAM Initiative\s*&\s*Dr\.?\s+Michelle(?:\s+Vivian)?\s+O[’']Rourke\.\s*All rights reserved\.", re.IGNORECASE),
          ]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.md")):
                  original = path.read_text(encoding="utf-8")
                  updated = original
                  for pattern in patterns:
                      updated = pattern.sub(lambda m: f"© {m.group(1)} Dr Michelle O'Rourke. All rights reserved.", updated)
                  if updated != original:
                      path.write_text(updated, encoding="utf-8")
                      changed.append(path.as_posix())
          print(f"Normalized copyright holder in {len(changed)} files")
          for path in changed:
              print(path)
          PY

      - name: Commit copyright-only normalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Governance; then
            echo "No copyright-holder changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Governance/
          git commit -m "Normalize Caelestis instrument copyright holder"
          git push origin HEAD:"${GITHUB_REF_NAME}"
