name: Apply red-team branch repair

on:
  push:
    branches:
      - agent/red-team-governance-repair-20260728
    paths:
      - .github/trigger/red-team-branch-repair-20260728.txt

permissions:
  contents: write

concurrency:
  group: red-team-branch-repair-20260728
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/red-team-governance-repair-20260728
          fetch-depth: 0

      - name: Fetch divergent policy branch
        run: git fetch origin policy/civilisational-wealth-governance:refs/remotes/origin/policy/civilisational-wealth-governance

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply missing doctrine sections only
        run: python scripts/apply_red_team_branch_repair.py

      - name: Validate markdown whitespace
        run: git diff --check

      - name: Show source-only repair diff
        run: |
          git status --short
          git diff --stat

      - name: Remove temporary automation files
        run: |
          rm -f scripts/apply_red_team_branch_repair.py
          rm -f .github/workflows/apply-red-team-branch-repair.yml
          rm -f .github/trigger/red-team-branch-repair-20260728.txt

      - name: Commit repaired doctrine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CAM Governance Automation"
          git config user.email "governance-automation@users.noreply.github.com"
          git add Governance/Charters/CAM-EQ2026-ETHICS-003-PLATINUM.md
          git add Governance/Charters/CAM-EQ2026-SECURITY-001-PLATINUM.md
          git add Governance/Charters/CAM-EQ2026-SECURITY-002-PLATINUM.md
          git add Governance/Charters/CAM-EQ2026-STEWARD-003-PLATINUM.md
          git add Governance/Charters/CAM-EQ2026-OPERATIONS-008-PLATINUM.md
          git add Governance/Constitution/CAM-BS2025-AEON-006-PLATINUM.md
          git add Governance/Constitution/CAM-BS2026-AEON-012-PLATINUM.md
          git add Governance/Constitution/CAM-BS2025-AEON-003-SCH-02.md
          git add Governance/Constitution/CAM-BS2025-AEON-001-SCH-01.md
          git add -u scripts/apply_red_team_branch_repair.py .github/workflows/apply-red-team-branch-repair.yml .github/trigger/red-team-branch-repair-20260728.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No doctrine repair was required."
            exit 0
          fi
          git commit -m "Restore divergent red-team governance doctrine"
          git push origin HEAD:agent/red-team-governance-repair-20260728
