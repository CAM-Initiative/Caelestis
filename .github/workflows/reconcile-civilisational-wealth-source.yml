name: Reconcile civilisational wealth source doctrine

on:
  push:
    branches:
      - agent/red-team-governance-repair-20260728
    paths:
      - .github/trigger/reconcile-civilisational-wealth-source-20260728.txt

permissions:
  contents: write

concurrency:
  group: reconcile-civilisational-wealth-source-20260728
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/red-team-governance-repair-20260728
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch remaining divergent branch
        run: git fetch origin policy/civilisational-wealth-governance:refs/remotes/origin/policy/civilisational-wealth-governance

      - name: Three-way reconcile source doctrine and existing ledger entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          OLD_REF = "origin/policy/civilisational-wealth-governance"
          FIXED_TIMESTAMP = "2026-07-28T09:35:31Z"
          INCORRECT_TIMESTAMP = "2026-07-26T00:00:00Z"
          TOKEN = "<!-- CAM_AMENDMENT_LEDGER_RECONCILIATION_TOKEN -->"
          EXCLUDED = {
              "Governance/Constitution/CAM-BS2025-AEON-003-SCH-01.md",
              "Governance/Constitution/CAM-BS2025-AEON-003-SCH-03.md",
              "Governance/Charters/CAM-EQ2026-OPERATIONS-008-PLATINUM.md",
          }

          heading_re = re.compile(r"^##+\s+.*amendment\s+ledger", re.IGNORECASE | re.MULTILINE)
          next_heading_re = re.compile(r"^##+\s+", re.MULTILINE)
          version_re = re.compile(r"^\d+(?:\.\d+)+$")

          def run(args, *, check=True):
              proc = subprocess.run(args, text=True, capture_output=True)
              if check and proc.returncode != 0:
                  raise RuntimeError(proc.stderr.strip() or proc.stdout.strip() or "Command failed: " + " ".join(args))
              return proc

          def git_text(ref, path):
              proc = run(["git", "show", f"{ref}:{path}"], check=False)
              return proc.stdout if proc.returncode == 0 else None

          def split_ledger(text):
              if text is None:
                  return None, None, None
              match = heading_re.search(text)
              if not match:
                  return text, None, ""
              tail = text[match.end():]
              nxt = next_heading_re.search(tail)
              end = match.end() + nxt.start() if nxt else len(text)
              return text[:match.start()], text[match.start():end], text[end:]

          def body_with_token(text):
              prefix, ledger, suffix = split_ledger(text)
              if ledger is None:
                  return text, None
              return prefix + TOKEN + suffix, ledger

          def row_cells(line):
              stripped = line.strip()
              if not stripped.startswith("|"):
                  return None
              cells = [cell.strip() for cell in stripped.strip("|").split("|")]
              if not cells or not version_re.match(cells[0]):
                  return None
              while len(cells) < 4:
                  cells.append("")
              return cells[:4]

          def parse_rows(ledger):
              rows = []
              if ledger is None:
                  return rows
              for idx, line in enumerate(ledger.splitlines(keepends=True)):
                  cells = row_cells(line)
                  if cells:
                      rows.append({"index": idx, "version": cells[0], "description": cells[1], "timestamp": cells[2], "hash": cells[3]})
              return rows

          def semver(value):
              return tuple(int(part) for part in value.split("."))

          def next_minor(versions):
              parsed = [semver(v) for v in versions if version_re.match(v)]
              top = max(parsed)
              if len(top) == 2:
                  return f"{top[0]}.{top[1] + 1}"
              return ".".join(str(p) for p in (*top[:-1], top[-1] + 1))

          def canonical_row(version, description, timestamp, hash_value):
              return f"| {version} | {description} | {timestamp} | {hash_value} |\n"

          def merge_ledger(path, current_ledger, old_ledger):
              if current_ledger is None and old_ledger is None:
                  return None
              if current_ledger is None:
                  current_ledger = old_ledger
              lines = current_ledger.splitlines(keepends=True)
              current_rows = parse_rows(current_ledger)

              # Correct an existing malformed duplicate red-team version in place.
              versions_to_descriptions = {}
              for row in current_rows:
                  versions_to_descriptions.setdefault(row["version"], set()).add(row["description"])
              for row in current_rows:
                  if row["timestamp"] != INCORRECT_TIMESTAMP:
                      continue
                  version = row["version"]
                  if len(versions_to_descriptions.get(version, set())) > 1:
                      if path != "Governance/Charters/CAM-EQ2026-OPERATIONS-007-PLATINUM.md":
                          raise RuntimeError(f"Unresolved duplicate amendment version in {path}: {version}")
                      new_version = next_minor([r["version"] for r in current_rows])
                      row["version"] = new_version
                  row["timestamp"] = FIXED_TIMESTAMP
                  row["hash"] = ""
                  lines[row["index"]] = canonical_row(row["version"], row["description"], row["timestamp"], row["hash"])

              current_ledger = "".join(lines)
              current_rows = parse_rows(current_ledger)
              keys = {(r["version"], r["description"]): r for r in current_rows}
              used_versions = {r["version"]: r["description"] for r in current_rows}
              additions = []

              for old_row in parse_rows(old_ledger):
                  version = old_row["version"]
                  description = old_row["description"]
                  timestamp = old_row["timestamp"]
                  hash_value = old_row["hash"]
                  key = (version, description)
                  is_red_team = timestamp == INCORRECT_TIMESTAMP

                  if key in keys:
                      if is_red_team:
                          target = keys[key]
                          target["timestamp"] = FIXED_TIMESTAMP
                          target["hash"] = ""
                      continue

                  if version in used_versions and used_versions[version] != description:
                      if is_red_team and path == "Governance/Charters/CAM-EQ2026-OPERATIONS-007-PLATINUM.md":
                          version = next_minor(list(used_versions))
                          key = (version, description)
                      else:
                          raise RuntimeError(f"Amendment version collision in {path}: {version}")

                  if is_red_team:
                      timestamp = FIXED_TIMESTAMP
                      hash_value = ""
                  additions.append({"version": version, "description": description, "timestamp": timestamp, "hash": hash_value})
                  used_versions[version] = description

              # Apply timestamp/hash corrections to matching rows already present.
              lines = current_ledger.splitlines(keepends=True)
              refreshed_rows = parse_rows(current_ledger)
              correction_map = {(r["version"], r["description"]): r for r in current_rows}
              for row in refreshed_rows:
                  corrected = correction_map.get((row["version"], row["description"]))
                  if corrected and (corrected["timestamp"] != row["timestamp"] or corrected["hash"] != row["hash"]):
                      lines[row["index"]] = canonical_row(row["version"], row["description"], corrected["timestamp"], corrected["hash"])

              if additions:
                  version_indices = [r["index"] for r in parse_rows("".join(lines))]
                  if not version_indices:
                      raise RuntimeError(f"Cannot locate amendment table insertion point in {path}")
                  insert_at = max(version_indices) + 1
                  new_lines = [canonical_row(a["version"], a["description"], a["timestamp"], a["hash"]) for a in additions]
                  lines[insert_at:insert_at] = new_lines

              return "".join(lines)

          base_ref = run(["git", "merge-base", "HEAD", OLD_REF]).stdout.strip()
          diff = run([
              "git", "diff", "--name-only", "--diff-filter=ACMR", f"{base_ref}..{OLD_REF}", "--",
              ":(glob)Governance/Charters/*.md", ":(glob)Governance/Constitution/*.md"
          ]).stdout.splitlines()

          candidates = []
          skipped = []
          for path in sorted(set(line.strip() for line in diff if line.strip())):
              if path in EXCLUDED or path.endswith("Index.md"):
                  skipped.append(path)
                  continue
              old_text = git_text(OLD_REF, path)
              if old_text is None:
                  continue
              base_text = git_text(base_ref, path)
              _bp, base_ledger, _bs = split_ledger(base_text)
              _op, old_ledger, _os = split_ledger(old_text)
              current_exists = Path(path).exists()
              if base_text is not None and old_ledger == base_ledger:
                  continue
              if not current_exists and base_text is None:
                  candidates.append(path)
                  continue
              if old_ledger is not None:
                  candidates.append(path)

          conflicts = []
          changed = []
          for path in candidates:
              old_text = git_text(OLD_REF, path)
              base_text = git_text(base_ref, path)
              target_path = Path(path)
              current_text = target_path.read_text(encoding="utf-8") if target_path.exists() else None

              if current_text is None:
                  merged_body, _ = body_with_token(old_text)
                  _op, old_ledger, _os = split_ledger(old_text)
                  merged_ledger = merge_ledger(path, old_ledger, old_ledger)
              else:
                  current_body, current_ledger = body_with_token(current_text)
                  old_body, old_ledger = body_with_token(old_text)
                  if base_text is None:
                      if current_body == old_body:
                          merged_body = current_body
                      else:
                          conflicts.append(f"{path}: independently added on both branches")
                          continue
                  else:
                      base_body, _base_ledger = body_with_token(base_text)
                      with tempfile.TemporaryDirectory() as tmpdir:
                          cur = Path(tmpdir) / "current"
                          base = Path(tmpdir) / "base"
                          old = Path(tmpdir) / "old"
                          cur.write_text(current_body, encoding="utf-8")
                          base.write_text(base_body, encoding="utf-8")
                          old.write_text(old_body, encoding="utf-8")
                          proc = run(["git", "merge-file", "-p", str(cur), str(base), str(old)], check=False)
                          if proc.returncode != 0:
                              conflicts.append(f"{path}: three-way source conflict")
                              continue
                          merged_body = proc.stdout
                  merged_ledger = merge_ledger(path, current_ledger, old_ledger)

              if merged_ledger is not None:
                  if merged_body.count(TOKEN) != 1:
                      conflicts.append(f"{path}: amendment ledger token count was {merged_body.count(TOKEN)}")
                      continue
                  merged_text = merged_body.replace(TOKEN, merged_ledger)
              else:
                  merged_text = merged_body

              if current_text != merged_text:
                  target_path.parent.mkdir(parents=True, exist_ok=True)
                  target_path.write_text(merged_text, encoding="utf-8")
                  changed.append(path)

          print("Source reconciliation candidates:")
          for path in candidates:
              print(f"- {path}")
          print("Changed source files:")
          for path in changed:
              print(f"- {path}")
          print("Intentionally excluded generated/current-authoritative files:")
          for path in skipped:
              print(f"- {path}")

          if conflicts:
              print("Conflicts requiring explicit resolution:")
              for conflict in conflicts:
                  print(f"- {conflict}")
              raise SystemExit(1)
          PY

      - name: Seal reconciled existing amendment entries
        shell: bash
        run: |
          set -euo pipefail
          git add Governance/Charters Governance/Constitution
          if git diff --cached --quiet; then
            echo "No source reconciliation changes were required."
          else
            python .github/scripts/lint_amendment_ledger.py --staged --fix --stage fix
            python .github/scripts/lint_amendment_ledger.py --staged --strict --stage post_fix
          fi
          if grep -R --line-number --fixed-strings '2026-07-26T00:00:00Z' Governance/Charters Governance/Constitution; then
            echo "Incorrect red-team placeholder timestamp remains in source doctrine."
            exit 1
          fi
          git diff --cached --check

      - name: Rebuild deterministic governance outputs
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/update-CAM-Constitution-Index.py
          python .github/scripts/update-CAM-Charters-Index.py
          python .github/scripts/update-CAM-Laws-Index.py
          python .github/scripts/update-CAM-Governance-Index.py
          python .github/scripts/update-CAM-BS2025-AEON-003-SCH-01.py
          python .github/scripts/update-CAM-BS2025-AEON-003-SCH-03.py
          python .github/scripts/update-CAM-Governance-Index.py
          python .github/scripts/build-canonical-code-index.py --root Governance
          git add Governance
          git diff --cached --check

      - name: Validate reconciled corpus
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/lint_amendment_ledger.py --all --strict --stage downstream_block
          python .github/scripts/verify-ledger-sha-coverage.py --strict-latest
          python .github/scripts/validate_canonical_headers.py
          mkdir -p validation-reports
          python .github/scripts/validate_markdown_section_refs.py --root Governance --report-file validation-reports/section-reference-report.tsv
          python .github/scripts/lint-symbolic-structures.py --index Governance/CAM.Canonical.Code.Index.json
          python - <<'PY'
          from pathlib import Path
          import json
          for path in Path('Governance').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Remove temporary reconciliation automation and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CAM Governance Automation"
          git config user.email "governance-automation@users.noreply.github.com"
          rm -f .github/workflows/reconcile-civilisational-wealth-source.yml
          rm -f .github/trigger/reconcile-civilisational-wealth-source-20260728.txt
          git add -u .github/workflows/reconcile-civilisational-wealth-source.yml .github/trigger/reconcile-civilisational-wealth-source-20260728.txt
          git add Governance
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit after reconciliation."
            exit 0
          fi
          git commit -m "Reconcile remaining civilisational wealth branch doctrine"
          git push origin HEAD:agent/red-team-governance-repair-20260728
