name: Metadata and Source-Authority Audit

on:
  push:
    branches: ["**"]
    paths:
      - "Governance/Constitution/**"
      - "Governance/Charters/**"
      - "Governance/Laws/**"
      - "Governance/Standards/**"
      - "Governance/Drafts/**"
      - ".github/scripts/audit_metadata_authority_contract.py"
      - ".github/scripts/migrate_pass_4_safe_metadata.py"
      - ".github/workflows/metadata-authority-audit.yml"
  pull_request:
    paths:
      - "Governance/Constitution/**"
      - "Governance/Charters/**"
      - "Governance/Laws/**"
      - "Governance/Standards/**"
      - "Governance/Drafts/**"
      - ".github/scripts/audit_metadata_authority_contract.py"
      - ".github/scripts/migrate_pass_4_safe_metadata.py"
      - ".github/workflows/metadata-authority-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metadata-authority-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply bounded safe metadata migration
        run: python .github/scripts/migrate_pass_4_safe_metadata.py

      - name: Build Pass 4 inventory
        run: |
          mkdir -p validation-reports
          python .github/scripts/audit_metadata_authority_contract.py \
            --json-out validation-reports/pass-4-metadata-authority-inventory.json \
            --md-out validation-reports/pass-4-metadata-authority-inventory.md

      - name: Upload Pass 4 inventory
        uses: actions/upload-artifact@v4
        with:
          name: pass-4-metadata-authority-inventory
          path: validation-reports/pass-4-metadata-authority-inventory.*

      - name: Commit bounded migration
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Governance/Drafts/ Governance/Standards/CAM-GOVERNANCE-METADATA-STANDARD.md
          if git diff --cached --quiet; then
            echo "No bounded migration files changed."
            exit 0
          fi
          git commit -m "[AUTO][Governance] Apply Pass 4 safe metadata migration"
          git push origin HEAD:"${GITHUB_REF_NAME}"
