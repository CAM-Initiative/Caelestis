name: Governance Rebuild

on:
  push:
    branches: ["main"]
    paths:
      - "Governance/Constitution/**"
      - "Governance/Charters/**"
      - "Governance/Laws/**"
      - "Governance/Standards/**"
      - "Governance/Drafts/**"
      - "Governance/CAM.*"
      - "CITATION.cff"
      - "PROVENANCE*.json"
      - ".github/scripts/**"
      - ".github/Indices/**"
  pull_request:
    paths:
      - "Governance/Constitution/**"
      - "Governance/Charters/**"
      - "Governance/Laws/**"
      - "Governance/Standards/**"
      - "Governance/Drafts/**"
      - "Governance/CAM.*"
      - "CITATION.cff"
      - "PROVENANCE*.json"
      - ".github/scripts/**"
      - ".github/Indices/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: governance-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip PyYAML==6.0.3

      - name: Telemetry — Git status before rebuild
        shell: bash
        run: |
          set -euo pipefail
          echo "GIT_STATUS_BEFORE_REBUILD_BEGIN"
          git status --short
          echo "GIT_STATUS_BEFORE_REBUILD_END"

      - name: Resolve comparison SHAs
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="HEAD~1"
            HEAD_SHA="HEAD"
          fi
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"

      - name: Phase 0 — Close Pass 3 draft boundary
        run: python .github/scripts/close_pass_3_draft_boundary.py

      - name: Phase 1 — Rebuild Constitution index/json
        run: python .github/scripts/update-CAM-Constitution-Index.py

      - name: Phase 1 — Rebuild Charters index/json
        run: python .github/scripts/update-CAM-Charters-Index.py

      - name: Phase 1 — Rebuild Laws index/json
        run: python .github/scripts/update-CAM-Laws-Index.py

      - name: Detect law-only changes
        shell: bash
        run: |
          set -euo pipefail
          RUN_LEDGER=true
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
            if [[ -n "$CHANGED" ]] && ! echo "$CHANGED" | grep -qvE '^Governance/Laws/'; then
              RUN_LEDGER=false
            fi
          fi
          echo "RUN_LEDGER=${RUN_LEDGER}" >> "$GITHUB_ENV"

      - name: Phase 2 — Populate latest ledger hashes (fix)
        if: env.RUN_LEDGER == 'true'
        run: python .github/scripts/lint_amendment_ledger.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --fix

      - name: Phase 2 — Validate ledger hashes (strict)
        if: env.RUN_LEDGER == 'true'
        run: python .github/scripts/lint_amendment_ledger.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --strict

      - name: Phase 3 — Rebuild Constitution index/json (post-hash)
        run: python .github/scripts/update-CAM-Constitution-Index.py

      - name: Phase 3 — Rebuild Charters index/json (post-hash)
        run: python .github/scripts/update-CAM-Charters-Index.py

      - name: Phase 3 — Rebuild Laws index/json (post-hash)
        run: python .github/scripts/update-CAM-Laws-Index.py

      - name: Phase 4 — Verify ledger SHA coverage and JSON consistency (strict latest)
        run: python .github/scripts/verify-ledger-sha-coverage.py --strict-latest

      - name: Phase 5 — Build global Governance registry
        run: python .github/scripts/update-CAM-Governance-Index.py

      - name: Phase 6 — Rebuild generated governance registries
        run: |
          python .github/scripts/update-CAM-Constitutional-Schedule-Registry.py
          python .github/scripts/update-CAM-Global-Operative-Instrument-Registry.py
          python .github/scripts/update-CAM-Model-Terminology-Audit.py

      - name: Phase 7 — Final global Governance rebuild
        run: python .github/scripts/update-CAM-Governance-Index.py

      - name: Phase 8 — Final strict ledger validation
        if: env.RUN_LEDGER == 'true'
        run: python .github/scripts/lint_amendment_ledger.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --strict

      - name: Phase 8 — Canonical document header validation
        run: python .github/scripts/validate_canonical_headers.py

      - name: Phase 8 — Canonical architecture terminology validation
        run: python .github/scripts/validate_canonical_architecture_terminology.py

      - name: Phase 8 — Document provenance and citation validation
        run: python .github/scripts/validate_document_provenance.py

      - name: Phase 8 — AI-BOM formation composition validation
        run: |
          python .github/scripts/validate_ai_bom.py \
            Governance/Standards/examples/caelestis-ai-bom-1.0.example.json \
            Governance/Standards/examples/caelestis-ai-bom-1.0.cyclonedx-1.7.example.json \
            Governance/Standards/mappings/caelestis-ai-bom-1.0.mappings.json \
            PROVENANCE.ai-bom.json

      - name: Phase 8 — Runtime formation snapshot validation
        run: |
          python .github/scripts/validate_runtime_state.py \
            Governance/Standards/examples/caelestis-runtime-state-1.0.example.json \
            PROVENANCE.runtime-state.json

      - name: Phase 8 — Runtime-processing architecture validation
        run: python .github/scripts/validate_runtime_processing_architecture.py

      - name: Phase 8 — Intra-document section reference validation
        run: |
          mkdir -p validation-reports
          python .github/scripts/validate_markdown_section_refs.py --root Governance --report-file validation-reports/section-reference-report.tsv

      - name: Phase 8 — Upload section-reference validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-reference-validation-report
          path: validation-reports/section-reference-report.tsv

      - name: Phase 8 — Canonical declaration and index generation
        run: python .github/scripts/build-canonical-code-index.py --root Governance

      - name: Phase 8 — Canonical reference integrity
        run: |
          mkdir -p validation-reports
          python .github/scripts/lint-symbolic-structures.py \
            --index Governance/CAM.Canonical.Code.Index.json \
            --inventory-out validation-reports/canonical-reference-inventory.json

      - name: Phase 8 — Upload canonical-reference inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-reference-inventory
          path: validation-reports/canonical-reference-inventory.json

      - name: Phase 8 — Stale output check (idempotency)
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_STATUS="$(git status --porcelain)"
          python .github/scripts/close_pass_3_draft_boundary.py
          python .github/scripts/update-CAM-Constitution-Index.py
          python .github/scripts/update-CAM-Charters-Index.py
          python .github/scripts/update-CAM-Laws-Index.py
          python .github/scripts/update-CAM-Governance-Index.py
          python .github/scripts/update-CAM-Constitutional-Schedule-Registry.py
          python .github/scripts/update-CAM-Global-Operative-Instrument-Registry.py
          python .github/scripts/update-CAM-Model-Terminology-Audit.py
          python .github/scripts/update-CAM-Governance-Index.py
          python .github/scripts/build-canonical-code-index.py --root Governance
          AFTER_STATUS="$(git status --porcelain)"
          if [[ "$BEFORE_STATUS" != "$AFTER_STATUS" ]]; then
            echo "Stale/non-idempotent generated outputs detected after re-run."
            git status --short
            exit 1
          fi

      - name: Phase 9 — Commit generated changes once
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "GIT_STATUS_BEFORE_COMMIT_BEGIN"
          git status --short
          echo "GIT_STATUS_BEFORE_COMMIT_END"
          if git diff --quiet; then
            echo "MUTATIONS_OCCURRED=false"
            echo "No changes to commit."
            exit 0
          fi
          echo "MUTATIONS_OCCURRED=true"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Governance/ .github/workflows/ .github/scripts/ .github/Indices/
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "[AUTO][Governance] Deterministic rebuild pipeline refresh"
          BRANCH="${GITHUB_REF_NAME}"
          echo "GIT_STATUS_BEFORE_PUSH_BEGIN"
          git status --short
          echo "GIT_STATUS_BEFORE_PUSH_END"
          git push origin HEAD:"${BRANCH}"
